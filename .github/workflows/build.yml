name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7


      - name: Fetch Russian Ministry of Digital Development CA certificates (for GigaChat)
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL -o app/src/main/res/raw/rus_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -fL -o app/src/main/res/raw/rus_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt

      # Голосовые модели кладём в свой релиз GitHub один раз: телефоны качают их оттуда,
      # а не с alphacephei.com, который в некоторых регионах недоступен
      - name: Publish voice models to a fixed release (once)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view models-v1 >/dev/null 2>&1; then
            curl -fL -o ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
            curl -fL -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            gh release create models-v1 ru.zip en.zip --title "Голосовые модели" --notes "Модели Vosk для распознавания речи"
          fi

      - name: Restore signing keystore from secret
        env:
          KS_B64: ${{ secrets.BARSIK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/barsik.jks"
            echo "BARSIK_KEYSTORE=$RUNNER_TEMP/barsik.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BARSIK_KS_PASS: ${{ secrets.BARSIK_KS_PASS }}
          BARSIK_KEY_ALIAS: ${{ secrets.BARSIK_KEY_ALIAS }}
          BARSIK_KEY_PASS: ${{ secrets.BARSIK_KEY_PASS }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Barsik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Barsik-apk
          path: Barsik.apk

      - name: Write version file
        run: echo "$GITHUB_RUN_NUMBER" > version.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Barsik (последняя сборка)
          files: |
            Barsik.apk
            version.txt
