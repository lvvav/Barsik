name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch Manrope font (optional, app falls back to system font)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/manrope.ttf https://github.com/googlefonts/manrope/raw/main/fonts/ttf/Manrope-Regular.ttf || echo "font not downloaded"

      - name: Fetch Russian Ministry of Digital Development CA certificates (for GigaChat)
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL -o app/src/main/res/raw/rus_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -fL -o app/src/main/res/raw/rus_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt

      - name: Build debug APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Barsik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Barsik-apk
          path: Barsik.apk

      - name: Write version file
        run: echo "$GITHUB_RUN_NUMBER" > version.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Barsik (последняя сборка)
          files: |
            Barsik.apk
            version.txt
