name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch offline Russian speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-ru-0.22 app/src/main/assets/model

      - name: Fetch Russian Ministry of Digital Development CA certificates (for GigaChat)
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL -o app/src/main/res/raw/rus_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -fL -o app/src/main/res/raw/rus_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt

      - name: Build debug APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Barsik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Barsik-apk
          path: Barsik.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Barsik (последняя сборка)
          files: Barsik.apk
